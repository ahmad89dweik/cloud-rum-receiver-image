name: Build and push

on:
  pull_request:
  push:
    branches: [main]

env:
  PROJECT_ID: streaming-pipeline-learn
  REGION: europe-west4
  REPOSITORY: cloud-run-images
  IMAGE: receiver

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          token_format: access_token
          workload_identity_provider: projects/719566735778/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-gar-push@streaming-pipeline-learn.iam.gserviceaccount.com

      - uses: docker/login-action@v3
        with:
          registry: europe-west4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=PR-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}"
          docker build -t "${IMAGE_URI}:${{ steps.meta.outputs.tag }}" .
          docker push "${IMAGE_URI}:${{ steps.meta.outputs.tag }}"
